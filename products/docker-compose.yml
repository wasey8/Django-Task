version: '3.9'
services:
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      - redis
    environment:
      - DJANGO_SETTINGS_MODULE=project.settings

  redis:
    image: redis:alpine

  worker:
    build: .
    command: celery -A project worker --loglevel=info
    depends_on:
      - redis
